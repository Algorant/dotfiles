# Global user-tool ownership.
# System and desktop packages remain under pacman/AUR; fast-moving user tools
# belong here. Global tools track rolling latest by policy and are not lockfile-pinned;
# every update is validated afterward by sysup verify. Rust is the exception:
# mise still owns the nightly toolchain with rust-src (`mise install rust`
# provisions it), but routine sysup upgrades exclude Rust (`mise upgrade
# --exclude rust`); run `sysup rust` (`mise upgrade rust`) explicitly to
# upgrade the compiler.

[tools]
bun = "latest"

uv = "latest"

node = "latest"

pi = "latest"

rust = { version = "nightly", components = ["rust-src"] }

herdr = "latest"

worktrunk = "latest"

"cargo:emeraldian" = "latest"

"github:michel-kraemer/zsh-patina" = "latest"

"github:Algorant/tandem" = { version = "latest", version_prefix = "tandem-v" }

"github:xdevplatform/xurl" = "latest"

"github:cachix/secretspec" = "latest"

"github:Algorant/ketch" = "latest"

"aqua:schollz/croc" = "latest"

# Terminal Markdown previewer; prebuilt GitHub release binaries.
"github:rivolink/leaf" = "latest"

# Scriptify interactive UI (confirm/choose/spin). Rolling latest; Pi skill
# falls back to echo/read when gum is missing or there is no TTY.
"aqua:charmbracelet/gum" = "latest"

# Jujutsu for a Git-replacement trial. Rolling latest. Not a production cutover.
"aqua:jj-vcs/jj" = "latest"

"github:ProtonPass/pass-cli" = "latest"

# fnox resolves approved Proton Pass references; SecretSpec remains installed
# only while repository consumers such as ffsync still depend on it.
"github:jdx/fnox" = "latest"

# flyctl moved here from AUR; aqua ships both the flyctl and fly names.
"aqua:superfly/flyctl" = "latest"

# Coding agents use mise's verified aqua registry backends. Keep these
# explicit so a registry priority change cannot silently switch ownership.
"aqua:anthropics/claude-code" = "latest"
"aqua:openai/codex" = "latest"
"aqua:anomalyco/opencode" = "latest"
"aqua:github/copilot-cli" = "latest"

"github:h4ckf0r0day/obscura" = { version = "latest", asset_pattern = 'obscura-{{ arch(x64="x86_64", arm64="aarch64") }}-linux.tar.gz' }


"npm:sideshow" = "latest"

# Playwright's agent CLI (binary playwright-cli), moved here from AUR.
# This is @playwright/cli, not the playwright test-runner package.
"npm:@playwright/cli" = "latest"

[settings]
# npm: identifies the registry/backend. Bun installs registry tools; Node >=22.18
# executes Sideshow's published Node-shebang command.
npm.package_manager = "bun"
# This machine deliberately follows absolute latest without mise's 24h delay.
minimum_release_age = "0s"

# Automatic native dotfile history. Machine identity stays in miserc.toml.
[settings.history]
sync = "sync"

[bootstrap.services.mise-history]
builtin = "history-watch"

