# Keep the laptop's built-in HDA output awake.
#
# Short notification sounds were lost while this device resumed from the
# default five-second WirePlumber suspend. Limit the exception to the built-in
# PCI audio controller. Other ALSA outputs, inputs, and Bluetooth devices keep
# their normal suspend behavior.
monitor.alsa.rules = [
  {
    matches = [
      {
        node.name = "~alsa_output.pci-0000_00_1f.3.*"
      }
    ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 0
      }
    }
  }
]
