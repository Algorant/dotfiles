user: "#ebdbb2"   # vellum
group: "#928374"  # muted gray

permission:
  read: "#8ec07c"         # fern
  write: "#e6bf86"        # ochre
  exec: "#689d6a"         # patina
  exec-sticky: "#b16286"  # muted purple
  no-access: "#665c54"    # ashbronze
  octal: "#83a598"        # aqua
  acl: "#83a598"          # aqua
  context: "#70764a"      # moss

date:
  hour-old: "#689d6a"  # patina: recent, but not glaring
  day-old: "#e6bf86"   # ochre: warm middle age
  older: "#70764a"     # moss: muted older files

size:
  none: "#665c54"    # ashbronze
  small: "#ebdbb2"   # vellum
  medium: "#d4be9a"  # soft warm foreground
  large: "#e6bf86"   # ochre

inode:
  valid: "#689d6a"   # patina
  invalid: "#665c54" # ashbronze

links:
  valid: "#689d6a"   # patina
  invalid: "#665c54" # ashbronze

tree-edge: "#665c54" # ashbronze

git-status:
  default: "#665c54"         # ashbronze
  unmodified: "#665c54"      # ashbronze
  ignored: "#665c54"         # ashbronze
  new-in-index: "#8ec07c"    # fern
  new-in-workdir: "#8ec07c"  # fern
  typechange: "#e6bf86"      # ochre
  deleted: "#cc241d"         # red
  renamed: "#83a598"         # aqua
  modified: "#e6bf86"        # ochre
  conflicted: "#fb4934"      # bright red
