#:schema https://fnox.jdx.dev/schema.json
root = true
env = "exec"
if_missing = "error"

[providers.proton]
type = "proton-pass"
vault = "fnox"

[secrets]
BRAVE_API_KEY = { provider = "proton", value = "ketch--default--brave-api-key", description = "Brave Search API key" }
CONTEXT7_API_KEY = { provider = "proton", value = "ketch--default--context7-api-key", description = "Context7 API key" }
