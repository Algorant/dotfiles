# mpv.conf — Verdigris
#
# Palette: theme_colors/.config/theme_colors/verdigris.css
# UI is provided by uosc (scripts/uosc); the built-in OSC is disabled.

# ---------------------------------------------------------------- ui
osc=no
osd-bar=no
border=no

# ---------------------------------------------------------------- osd
# Vellum text on an ashbronze outline so messages stay readable on any frame.
osd-font='Adwaita Sans'
osd-font-size=32
osd-color='#ebdbb2'
osd-border-color='#1d2021'
osd-border-size=2
osd-shadow-offset=1
osd-shadow-color='#00000080'
osd-duration=1500

# ---------------------------------------------------------------- subtitles
sub-font='Adwaita Sans'
sub-color='#ebdbb2'
sub-border-color='#1d2021'
sub-border-size=2.5
sub-shadow-offset=0
sub-auto=fuzzy

# ---------------------------------------------------------------- video
profile=high-quality
vo=gpu-next
hwdec=vaapi
background-color='#1d2021'

# ---------------------------------------------------------------- behaviour
keep-open=yes
save-position-on-quit=yes
screenshot-format=png
screenshot-directory=~/Pictures/mpv
