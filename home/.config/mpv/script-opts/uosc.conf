# uosc.conf — Verdigris
#
# Palette: theme_colors/.config/theme_colors/verdigris.css
#   vellum  #ebdbb2   warm text           -> icons, seekbar fill, hover tile
#   patina  #689d6a   primary green       -> success
#   bg0     #1d2021   background          -> chrome, glyph on vellum
#   red     #e36f63   muted red           -> error
#   ashbronze #665c54 weathered metal     -> window border
#   aqua    #83a598   cool accent         -> search matches
#   ochre   #e6bf86   warm brass          -> timeline heatmap
# uosc takes plain RGB hex without a leading '#'. Every key uosc defines is
# set here; anything omitted silently falls back to uosc's own default, which
# is how the window border ended up black.

# foreground is deliberately vellum, not fern. uosc draws the hover tile and
# the icon from the same `foreground` value (elements/Button.lua), so on hover
# the tile and glyph always collapse to one color. A saturated green made that
# collapse loud; vellum keeps it quiet. This also sets the seekbar fill, so the
# chrome carries no green at all.
color=foreground=ebdbb2,foreground_text=1d2021,background=1d2021,background_text=ebdbb2,window_border=665c54,curtain=1d2021,success=689d6a,error=e36f63,match=83a598,heatmap=e6bf86

# ---------------------------------------------------------------- layout
# Auto-hide: controls appear on mouse proximity. Set timeline_persistency=1
# or add 'timeline' to top_bar_persistency for an always-visible bar.
timeline_style=bar
timeline_line_width=3
timeline_size=40
timeline_border=1
timeline_persistency=

# Thin position line that stays visible in windowed mode after the controls
# retract, so the window is never completely chromeless.
# progress_size is a raw pixel height and is NOT multiplied by state.scale,
# so it stays the same thickness windowed and fullscreen.
progress=windowed
progress_size=4

top_bar=no-border
top_bar_size=40
top_bar_persistency=
top_bar_controls=left
top_bar_title=yes

controls=menu,gap,subtitles,<has_many_audio>audio,<has_many_video>video,<has_many_edition>editions,<stream>stream-quality,gap,space,speed,space,gap,shuffle,loop-playlist,loop-file,gap,prev,items,next,gap,fullscreen
controls_size=32
controls_margin=10
controls_spacing=4
controls_persistency=

volume=right
volume_size=36
volume_border=1
volume_persistency=

# ---------------------------------------------------------------- style
# controls=0.85 is the important one. uosc's own default is 0, which draws
# button backgrounds only on hover and leaves bare icons floating on the video.
# speed=0.85 matches controls so the speed widget gets the same light box as
# the buttons instead of floating unbacked.
opacity=timeline=0.9,position=1,chapters=0.8,slider=0.9,slider_gauge=1,controls=0.85,speed=0.85,menu=1,submenu=0.4,border=1,title=1,tooltip=1,thumbnail=1

# border_radius is in pixels, multiplied by scale and rounded. Values below 0.5
# round to 0 and give square corners.
border_radius=6
text_border=1.5
font_scale=1
font_bold=no

# ---------------------------------------------------------------- behaviour
autohide=no
proximity_in=40
proximity_out=120
pause_indicator=flash
adjust_osd_margins=yes

# scale applies windowed, scale_fullscreen when fullscreen OR maximized.
# uosc's default 1.3 makes windowed chrome look undersized by comparison;
# 1.15 keeps fullscreen bigger without the two modes disagreeing.
scale=1
scale_fullscreen=1.15
